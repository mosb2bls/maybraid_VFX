[workspace.package]
version = "0.1.3"
edition = "2021"
license = "LICENSE.md" 
authors = ["Ramate LLC"]
repository = "www.github.com/ramate-io/maybraid"
homepage = "www.github.com/ramate-io/maybraid"
publish = false
rust-version = "1.95.0"


[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3.0"
async-trait = "0.1.71"
clap = { version = "4.4.10", features = ["derive"] }
dotenv = "0.15.0"
futures = "0.3.17"
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
thiserror = "1.0.50"
tracing = "0.1.40"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-test = "0.2.5"
tokio = { version = "1.35.1", default-features = false }
tokio-stream = "0.1.15"
hex = { version = "0.4.3", default-features = false, features = [
  "alloc",
  "serde",
] }
zip = { version = "2.4.2", features = ["flate2"] }
walkdir = "2.3.2"
tempfile = "3.5.0"
itertools = "0.14.0"
paste = "1.0"
regex = "1.9.0"
syn = { version = "2.0", features = ["full"] }
quote = "1.0.23"
proc-macro2 = "1.0.32"
proc-macro-error = { version = "1.0.4", features = ["syn-error"] }
strip-ansi-escapes = "0.2.1"
cargo_metadata = "0.19.2"
ignore = "0.4.20"
convert_case = "0.8.0"
toml = "0.8.20"
tonic = "0.12.3"
tonic-build = { version = "0.12.3", features = ["prost"] }
tonic-reflection = "0.12.3"
tonic-web = "0.12.3"
prost = "0.13.3"
leptos = "0.8.8"
leptos_router = "0.8.8"
leptos-use = { version = "0.16", default-features = false, features = [
    "use_raf_fn",
    "use_debounce_fn"
] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = "0.3"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.2" }
chrono = { version = "0.4.41" }
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
bevy = { version = "0.19.1" }
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }
js-sys = "0.3"
log = "0.4"
console_log = "1"
lychee-lib = { git = "https://github.com/lycheeverse/lychee", rev = "d6c2bbe6f1e7b9e83889fc1e7fc675a38a7dd75f" }
