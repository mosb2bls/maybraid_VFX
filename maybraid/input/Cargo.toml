[package]
name = "maybraid-input"
version = { workspace = true }
edition  = { workspace = true }
license  = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
publish = { workspace = true }
rust-version = { workspace = true }

[dependencies]
bevy = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString"] }
objc2-game-controller = { version = "0.3", features = [
	"GCController",
	"GCDevice",
	"GCDeviceHaptics",
	"GCExtendedGamepad",
	"GCGamepad",
	"GCControllerAxisInput",
	"GCControllerButtonInput",
	"GCControllerDirectionPad",
	"GCControllerElement",
	"GCInputNames",
	"GCPhysicalInputProfile",
	"GCXboxGamepad",
] }
objc2-core-haptics = { version = "0.3", default-features = false, features = [
	"CHHapticEngine",
	"CHHapticEvent",
	"CHHapticParameter",
	"CHHapticPattern",
	"CHHapticPatternPlayer",
] }

[dev-dependencies]
anyhow = { workspace = true }

[lints]
workspace = true
