# This workflow runs cargo check on every pushed commit.
# Restores the cargo-test rust-cache (release + registry) and does not save,
# so check stays covered without a second ~1.5 GB cache entry.

name: Cargo Check

on:
  push:
    branches:

jobs:
  cargo-check:
    uses: ./.github/workflows/nix-command.yml
    with:
      command: cargo check --locked
      nix_flake_path: '.'
      runner: 'ubuntu-24.04'
      rust_cache_key: cargo-release-test
      rust_cache_save: false
