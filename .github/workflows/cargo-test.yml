# This workflow runs cargo test on every pushed commit, including main.
# Main pushes must keep running: rust-cache only saves on main, and PR
# jobs restore that entry.

name: Cargo Test

on:
  push:
    branches:

jobs:
  cargo-test:
    uses: ./.github/workflows/nix-command.yml
    with:
      command: cargo test --release --locked
      nix_flake_path: '.'
      runner: 'ubuntu-24.04'
      rust_cache_key: cargo-release-test
